# Конфиг для запуска в Docker Compose (уже в образе как /app/config.yaml).
# Для горячей перезагрузки смонтируйте свой config.yaml с хоста (см. docker-compose.yml).

listen: "0.0.0.0:8080"
metrics_listen: "0.0.0.0:8081"

upstreams:
  - host: "127.0.0.1"
    port: 9001
  - host: "127.0.0.1"
    port: 9002


timeouts:
  connect_ms: 1000
  read_ms: 5000
  write_ms: 5000
  total_ms: 10000

limits:
  max_client_conns: 1000
  max_conns_per_upstream: 250

logging:
  level: "debug"

connection_pool:
  max_size: 50
  max_connections_per_host: 25
  idle_timeout: 15.0
  connect_timeout: 2.0
  read_timeout: 10.0

circuit_breaker:
  failure_threshold: 5
  recovery_timeout: 10.0
  half_open_max_requests: 1
  timeout: 2.0