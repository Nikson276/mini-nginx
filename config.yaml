# Конфиг для запуска в Docker Compose (уже в образе как /app/config.yaml).
# Для горячей перезагрузки смонтируйте свой config.yaml с хоста (см. docker-compose.yml).

listen: "0.0.0.0:8080"
metrics_listen: "0.0.0.0:8081"

upstreams:
  - host: "127.0.0.1"
    port: 9001
  - host: "127.0.0.1"
    port: 9002

timeouts:
  connect_ms: 1000
  read_ms: 5000
  write_ms: 5000
  total_ms: 10000

# Для ~1000 RPS при латентности ~2 с нужно ~2000 одновременных соединений (клиент + апстрим).
# Требуется ulimit на открытые файлы >= 5000 (см. docs или systemd LimitNOFILE).
limits:
  max_client_conns: 2500
  max_conns_per_upstream: 1000

logging:
  level: "info"

# max_size — общий лимит пула aiohttp; должен быть >= число_апстримов × max_connections_per_host.
# Для 1000 RPS: ~1000 соединений на хост × 2 апстрима = 2000; ставим с запасом.
connection_pool:
  max_size: 2500
  max_connections_per_host: 2000
  idle_timeout: 15.0
  connect_timeout: 5.0
  read_timeout: 30.0

# Таймаут CB должен быть >= timeouts.total_ms (иначе CB режет запросы раньше общего таймаута).
# При пиках 1200 VUs: больше пул (см. выше), в half-open — больше допускаемых сбоев и увеличенный таймаут для проб.
circuit_breaker:
  failure_threshold: 120
  recovery_timeout: 15.0
  half_open_max_requests: 20
  half_open_max_failures: 12
  half_open_timeout_multiplier: 2
  timeout: 12.0